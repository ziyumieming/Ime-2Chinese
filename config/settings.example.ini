; Runtime configuration is generated under %AppData%\ImeAssist.
; Feature preferences are retained; input features attach in P2/P4.
; Hotkeys: modifiers ^ ! + # and one named key, letter, number or F key.
[General]
EnableRefeed=1
EnableAutoSwitch=1
RefeedHotkey=!z
RecoverHotkey=!+z
SendIntervalMs=10
MaxRefeedLength=50
CopyTimeoutMs=300

[Ime]
; Friendly target name; installed input-profile identity will be resolved in P0.
RefeedTarget=SogouPinyin

[AutoSwitch]
PollIntervalMs=300
DefaultAction=Ignore

; Add specific title/Ignore rules before general process rules.
; No browser-wide mode is enabled by default.
; [Rule.ExampleTitle]
; Process=msedge.exe
; TitleContains=Example page
; Mode=Chinese
