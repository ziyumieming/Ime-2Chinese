; Runtime configuration is generated under %AppData%\ImeAssist.
; Auto-switch fields below are retained only for the frozen legacy MVP.
; Normal and refeed-only entry points do not start window polling.
; Hotkeys: modifiers ^ ! + # and one named key, letter, number or F key.
[General]
EnableRefeed=1
EnableAutoSwitch=1
RefeedHotkey=!z
RecoverHotkey=!+z
SendIntervalMs=10
MaxRefeedLength=50
CopyTimeoutMs=300

[Ime]
; Retained for older configs. Current operations never activate another IME.
RefeedTarget=SogouPinyin

[AutoSwitch]
PollIntervalMs=300
DefaultAction=Ignore

; Window auto-switch development and rule configuration have been withdrawn.
; Existing legacy fields/rules remain compatible; no rules are generated.
